# Unit tests and lint on every pull request and every push to main.
#
# The suite is standard library only apart from pytest, needs no token and no
# network (test_issues_api.py poisons sockets and asserts the poison is live),
# so this job holds read access and nothing else. That makes it safe to run on
# pull requests from forks. pull_request_target is never used: it would run a
# fork's code with this repository's write token.
#
# The packaged action itself is exercised by validate-action.yml, which loads
# action.yml through GitHub's own parser. This file is the fast half.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request makes the older run pointless.
  # Runs on main are never cancelled, so every commit there keeps a result.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor selfcheck.py promises adopters; 3.14 is the newest
        # the suite is pinned against. The action runs under whatever python3
        # the runner provides, so a version in between is covered too.
        python: ['3.11', '3.12', '3.14']
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      # ruff comes from requirements-dev.txt, not from whatever the runner has,
      # so CI and a laptop disagree only when the pinned version moves.
      - name: Install lint dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .
