# Build-order step 3: prove Syft and Grype install and produce output on a
# runner. Deliberately does nothing else — no diff, no state file, no issues,
# no commit. Those arrive in steps 4 and 5, and each needs a permission this
# workflow does not have.
name: watchdog (dispatch only)

on:
  workflow_dispatch:

# contents:write for the state file commit-back, and nothing else. issues:write
# arrives with step 4 part 3, which is the step that actually files issues.
permissions:
  contents: write

concurrency:
  # The state file is a read-modify-write on a committed file, so two runs must
  # not interleave. Queue rather than cancel: cancelling would throw away a
  # completed scan, and the point of the tool is not to miss one.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned deliberately. An unpinned scanner that changes its JSON schema under
  # you is the exact failure real_0117.json exists to catch, and it should
  # happen on a version bump someone chose, not on an unrelated Tuesday.
  SYFT_VERSION: v1.51.0
  GRYPE_VERSION: v0.117.0

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Third-party actions are pinned by commit SHA for the same reason Syft
      # and Grype are pinned by version: a moving tag is somebody else's
      # decision to run new code in this workspace.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the commit-back rebases onto origin before pushing,
          # and a depth-1 clone has nothing to rebase onto.
          fetch-depth: 0

      # workflow_dispatch pins github.sha at dispatch time, so checkout can hand
      # us a tree older than the branch tip - which is exactly how two runs both
      # decided they were bootstrapping. Re-read the state file from the ref.
      #
      # Only the state file is taken, not a full pull: the job should scan the
      # code it was dispatched for, and the test suite has already run against
      # that code by the time anything here executes.
      - name: Sync the state file with the branch tip
        run: |
          set -euo pipefail
          git fetch --quiet origin "${GITHUB_REF_NAME}"
          remote_state="origin/${GITHUB_REF_NAME}:.sbom-watchdog/findings.json"
          if git cat-file -e "${remote_state}" 2>/dev/null; then
            mkdir -p .sbom-watchdog
            git show "${remote_state}" > .sbom-watchdog/findings.json
            echo "state file synced from origin/${GITHUB_REF_NAME}"
          else
            echo "no state file on origin/${GITHUB_REF_NAME} yet - this run bootstraps"
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      # If the parser is broken, fail here rather than producing a scan nobody
      # validated. The suite is stdlib-only apart from pytest itself.
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest -q

      # Anchore's install.sh is deliberately not used. It took a 302 from
      # GitHub's asset CDN (release-assets.githubusercontent.com) as an error
      # rather than following it, so the checksum and tar steps then ran
      # against a file that was never downloaded. Fetching the tarball directly
      # puts our own curl flags in charge of redirect handling, and removes a
      # script that moves independently of the tag we pinned.
      - name: Install and verify Syft and Grype
        run: |
          set -euo pipefail

          # A daily job should survive one bad response from a CDN without
          # filing a red run.
          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then
                echo "::error::failed after 3 attempts: $*"
                return 1
              fi
              echo "attempt ${attempt} failed, retrying in 5s: $*"
              attempt=$((attempt + 1))
              sleep 5
            done
          }

          install_tool() {
            local name="$1" version="$2"
            local tarball="${name}_${version}_linux_amd64.tar.gz"
            local checksums="${name}_${version}_checksums.txt"
            local base="https://github.com/anchore/${name}/releases/download/v${version}"
            local work
            work="$(mktemp -d)"

            retry curl -fsSL -o "${work}/${tarball}" "${base}/${tarball}"
            retry curl -fsSL -o "${work}/${checksums}" "${base}/${checksums}"

            # Grep the single line first. `sha256sum -c` over the whole file
            # would need --ignore-missing, which passes vacuously when the
            # download produced nothing — exactly the failure being fixed here.
            ( cd "${work}" && grep " ${tarball}$" "${checksums}" | sha256sum -c - )

            tar -xzf "${work}/${tarball}" -C "${work}" "${name}"
            sudo install -m 0755 "${work}/${name}" "/usr/local/bin/${name}"
            rm -rf "${work}"
          }

          install_tool syft "${SYFT_VERSION#v}"
          install_tool grype "${GRYPE_VERSION#v}"

          syft version
          grype version

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p out
          syft scan dir:. -o cyclonedx-json=out/sbom.cdx.json

      - name: Scan the SBOM with Grype
        # Grype exits non-zero when it finds vulnerabilities at or above its
        # fail-on threshold. Nothing is set here, but be explicit: this step
        # proves the tools run, and findings are not a failure of that.
        run: grype "sbom:out/sbom.cdx.json" -o json --file out/grype.json

      # Zero matches is the expected outcome for this repo and must not fail
      # the run. A document missing `matches` entirely, or truncated, must —
      # that is the difference between "nothing to report" and "no report".
      - name: Validate the Grype document
        run: |
          python - <<'PY'
          import json, sys

          try:
              report = json.load(open("out/grype.json"))
          except (OSError, json.JSONDecodeError) as exc:
              sys.exit(f"Grype output is not readable JSON: {exc}")

          if not isinstance(report, dict):
              sys.exit(f"Grype output is {type(report).__name__}, expected an object")
          if "matches" not in report:
              sys.exit("Grype output has no top-level 'matches' key")
          if not isinstance(report["matches"], list):
              sys.exit("Grype 'matches' is not a list")

          print(f"document valid: {len(report['matches'])} matches")
          PY

      - name: Summarise what was produced
        run: |
          echo "SBOM:  $(wc -c < out/sbom.cdx.json) bytes"
          echo "Grype: $(wc -c < out/grype.json) bytes"
          python - <<'PY'
          import json
          report = json.load(open("out/grype.json"))
          matches = report.get("matches", [])
          descriptor = report.get("descriptor", {})
          db = descriptor.get("db", {})
          status = db.get("status", {}) if isinstance(db, dict) else {}
          print(f"grype {descriptor.get('version')}, {len(matches)} matches")
          print("db built:", status.get("built", db.get("built")))
          PY

      # Updates the state file in place, but only when the document actually
      # changed. `changed` is set from state_documents_equal, not from git:
      # generated_at moves on every run, so a textual diff would commit daily
      # with nothing in it.
      - name: Update the state document
        id: state
        run: |
          set -euo pipefail
          python -m src.run --scan out/grype.json --state .sbom-watchdog/findings.json --write-state --syft-version "${SYFT_VERSION#v}"
          # The artifact carries the state file either way, changed or not.
          if [ -f .sbom-watchdog/findings.json ]; then
            cp .sbom-watchdog/findings.json out/findings.json
          fi

      - name: Commit the updated state file
        if: steps.state.outputs.state_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # checkout v6 moved the persisted credential out of .git/config, so
          # record whether an ambient one exists rather than assuming either way.
          if git config --local --get-regexp '^http\..*\.extraheader' >/dev/null 2>&1; then
            echo "ambient credential IS present in .git/config"
          else
            echo "no ambient credential in .git/config - the explicit token is doing the work"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # run.py appends to $GITHUB_OUTPUT, so the newest value of each key is
          # the last one written. Reading them back here means the message is
          # built the same way on the first attempt and on every recompute.
          latest() { grep "^$1=" "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-; }

          build_message() {
            if [ "$(latest bootstrap)" = "true" ]; then
              echo "Vulnerability state: baseline, $(latest recorded) findings recorded [skip ci]"
            elif [ "$(latest new)" -gt 0 ] || [ "$(latest resolved)" -gt 0 ]; then
              echo "Vulnerability state: $(latest new) new, $(latest resolved) resolved [skip ci]"
            else
              echo "Vulnerability state: no change (scan of $(latest scan_date)) [skip ci]"
            fi
          }

          stage_and_commit() {
            git add .sbom-watchdog/findings.json
            if git diff --cached --quiet; then
              echo "nothing staged - the file already matches HEAD"
              return 1
            fi
            git commit -m "$(build_message)" -m "Run ${GITHUB_RUN_ID} of ${GITHUB_WORKFLOW}."
          }

          if ! stage_and_commit; then
            echo "another run already recorded this; nothing to commit"
            exit 0
          fi

          attempt=1
          while true; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi

            if [ "${attempt}" -ge 3 ]; then
              echo "::error::push rejected after 3 attempts"
              exit 1
            fi

            # The state file is derived output, not text to merge, and run.py is
            # deterministic given a scan plus a prior state. So discard our
            # commit outright and recompute against whatever origin now holds,
            # rather than rebasing two independently-derived versions together.
            # out/grype.json is untracked, so reset --hard leaves the scan alone.
            echo "push rejected on attempt ${attempt}; recomputing against origin"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"

            python -m src.run --scan out/grype.json --state .sbom-watchdog/findings.json --write-state --syft-version "${SYFT_VERSION#v}"

            if [ "$(latest state_changed)" != "true" ]; then
              echo "another run already recorded this; nothing to commit"
              exit 0
            fi

            if ! stage_and_commit; then
              echo "another run already recorded this; nothing to commit"
              exit 0
            fi

            attempt=$((attempt + 1))
          done

      - name: Report that nothing changed
        if: steps.state.outputs.state_changed != 'true'
        run: echo "no change; nothing committed"

      - name: Upload SBOM and scan output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-and-scan
          path: out/
          retention-days: 7
