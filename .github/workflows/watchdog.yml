# Build-order step 3: prove Syft and Grype install and produce output on a
# runner. Deliberately does nothing else — no diff, no state file, no issues,
# no commit. Those arrive in steps 4 and 5, and each needs a permission this
# workflow does not have.
name: watchdog (dispatch only)

on:
  workflow_dispatch:

# Read-only. contents:write and issues:write arrive with the steps that need
# them, not before.
permissions:
  contents: read

env:
  # Pinned deliberately. An unpinned scanner that changes its JSON schema under
  # you is the exact failure real_0117.json exists to catch, and it should
  # happen on a version bump someone chose, not on an unrelated Tuesday.
  SYFT_VERSION: v1.51.0
  GRYPE_VERSION: v0.117.0

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Third-party actions are pinned by commit SHA for the same reason Syft
      # and Grype are pinned by version: a moving tag is somebody else's
      # decision to run new code in this workspace.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      # If the parser is broken, fail here rather than producing a scan nobody
      # validated. The suite is stdlib-only apart from pytest itself.
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest -q

      # Anchore's install.sh is deliberately not used. It took a 302 from
      # GitHub's asset CDN (release-assets.githubusercontent.com) as an error
      # rather than following it, so the checksum and tar steps then ran
      # against a file that was never downloaded. Fetching the tarball directly
      # puts our own curl flags in charge of redirect handling, and removes a
      # script that moves independently of the tag we pinned.
      - name: Install and verify Syft and Grype
        run: |
          set -euo pipefail

          # A daily job should survive one bad response from a CDN without
          # filing a red run.
          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then
                echo "::error::failed after 3 attempts: $*"
                return 1
              fi
              echo "attempt ${attempt} failed, retrying in 5s: $*"
              attempt=$((attempt + 1))
              sleep 5
            done
          }

          install_tool() {
            local name="$1" version="$2"
            local tarball="${name}_${version}_linux_amd64.tar.gz"
            local checksums="${name}_${version}_checksums.txt"
            local base="https://github.com/anchore/${name}/releases/download/v${version}"
            local work
            work="$(mktemp -d)"

            retry curl -fsSL -o "${work}/${tarball}" "${base}/${tarball}"
            retry curl -fsSL -o "${work}/${checksums}" "${base}/${checksums}"

            # Grep the single line first. `sha256sum -c` over the whole file
            # would need --ignore-missing, which passes vacuously when the
            # download produced nothing — exactly the failure being fixed here.
            ( cd "${work}" && grep " ${tarball}$" "${checksums}" | sha256sum -c - )

            tar -xzf "${work}/${tarball}" -C "${work}" "${name}"
            sudo install -m 0755 "${work}/${name}" "/usr/local/bin/${name}"
            rm -rf "${work}"
          }

          install_tool syft "${SYFT_VERSION#v}"
          install_tool grype "${GRYPE_VERSION#v}"

          syft version
          grype version

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p out
          syft scan dir:. -o cyclonedx-json=out/sbom.cdx.json

      - name: Scan the SBOM with Grype
        # Grype exits non-zero when it finds vulnerabilities at or above its
        # fail-on threshold. Nothing is set here, but be explicit: this step
        # proves the tools run, and findings are not a failure of that.
        run: grype "sbom:out/sbom.cdx.json" -o json --file out/grype.json

      # Zero matches is the expected outcome for this repo and must not fail
      # the run. A document missing `matches` entirely, or truncated, must —
      # that is the difference between "nothing to report" and "no report".
      - name: Validate the Grype document
        run: |
          python - <<'PY'
          import json, sys

          try:
              report = json.load(open("out/grype.json"))
          except (OSError, json.JSONDecodeError) as exc:
              sys.exit(f"Grype output is not readable JSON: {exc}")

          if not isinstance(report, dict):
              sys.exit(f"Grype output is {type(report).__name__}, expected an object")
          if "matches" not in report:
              sys.exit("Grype output has no top-level 'matches' key")
          if not isinstance(report["matches"], list):
              sys.exit("Grype 'matches' is not a list")

          print(f"document valid: {len(report['matches'])} matches")
          PY

      - name: Summarise what was produced
        run: |
          echo "SBOM:  $(wc -c < out/sbom.cdx.json) bytes"
          echo "Grype: $(wc -c < out/grype.json) bytes"
          python - <<'PY'
          import json
          report = json.load(open("out/grype.json"))
          matches = report.get("matches", [])
          descriptor = report.get("descriptor", {})
          db = descriptor.get("db", {})
          status = db.get("status", {}) if isinstance(db, dict) else {}
          print(f"grype {descriptor.get('version')}, {len(matches)} matches")
          print("db built:", status.get("built", db.get("built")))
          PY

      # Runs the diff and writes the state document it *would* commit, to a
      # temp path. Nothing is committed and no issue is filed: this job still
      # holds contents:read only. The artifact is here to be read before the
      # next phase is given permission to write anything.
      - name: Compute the state document (writes nothing to the repo)
        run: |
          python -m src.run             --scan out/grype.json             --state .sbom-watchdog/findings.json             --out out/findings.next.json             --syft-version "${SYFT_VERSION#v}"

      - name: Upload SBOM and scan output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-and-scan
          path: out/
          retention-days: 7
